<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practical No. 6 - Marks Calculator</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-orange-500 via-red-500 to-pink-500 flex items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-3xl bg-white/20 backdrop-blur-xl border border-white/30 
                shadow-2xl rounded-3xl p-6 sm:p-8">

        <!-- Heading -->
        <div class="text-center mb-8">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-wide">
                USN-IT25061
            </h1>

            <p class="text-white/80 mt-2 text-lg">
                Marks Calculator
            </p>
        </div>

        <!-- Table Container -->
        <div class="overflow-x-auto rounded-2xl shadow-lg">

            <table class="w-full text-center bg-white/90 rounded-2xl overflow-hidden">

                <!-- Table Header -->
                <thead>
                    <tr class="bg-gradient-to-r from-orange-600 to-pink-500 text-white">
                        <th class="px-4 py-4 font-semibold">SR.NO</th>
                        <th class="px-4 py-4 font-semibold">SUBJECTS</th>
                        <th class="px-4 py-4 font-semibold">MARKS</th>
                    </tr>
                </thead>

                <!-- Table Body -->
                <tbody class="text-gray-700">

                    <tr class="border-b hover:bg-indigo-50 transition">
                        <td class="px-4 py-3 font-semibold">1</td>
                        <td class="px-4 py-3 font-semibold">OOPS</td>
                        <td class="px-4 py-3">
                            <input type="number" id="s1"
                                placeholder="Enter Marks"
                                class="w-full sm:w-40 px-3 py-2 rounded-lg border border-gray-300
                                focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </td>
                    </tr>

                    <tr class="border-b hover:bg-indigo-50 transition">
                        <td class="px-4 py-3 font-semibold">2</td>
                        <td class="px-4 py-3 font-semibold">DS</td>
                        <td class="px-4 py-3">
                            <input type="number" id="s2"
                                placeholder="Enter Marks"
                                class="w-full sm:w-40 px-3 py-2 rounded-lg border border-gray-300
                                focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </td>
                    </tr>

                    <tr class="border-b hover:bg-indigo-50 transition">
                        <td class="px-4 py-3 font-semibold">3</td>
                        <td class="px-4 py-3 font-semibold">MDM-WD</td>
                        <td class="px-4 py-3">
                            <input type="number" id="s3"
                                placeholder="Enter Marks"
                                class="w-full sm:w-40 px-3 py-2 rounded-lg border border-gray-300
                                focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </td>
                    </tr>

                    <tr class="border-b hover:bg-indigo-50 transition">
                        <td class="px-4 py-3 font-semibold">4</td>
                        <td class="px-4 py-3 font-semibold">CAO</td>
                        <td class="px-4 py-3">
                            <input type="number" id="s4"
                                placeholder="Enter Marks"
                                class="w-full sm:w-40 px-3 py-2 rounded-lg border border-gray-300
                                focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </td>
                    </tr>

                    <tr class="hover:bg-indigo-50 transition">
                        <td class="px-4 py-3 font-semibold">5</td>
                        <td class="px-4 py-3 font-semibold">ED</td>
                        <td class="px-4 py-3">
                            <input type="number" id="s5"
                                placeholder="Enter Marks"
                                class="w-full sm:w-40 px-3 py-2 rounded-lg border border-gray-300
                                focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        </td>
                    </tr>

                </tbody>

                <!-- Button -->
                <tfoot>
                    <tr>
                        <td colspan="3" class="px-4 py-6">
                            <button
                                onclick="calc()"
                                class="bg-gradient-to-r from-orange-500 to-red-500
                                hover:from-red-500 hover:to-pink-500
                                text-white font-bold py-3 px-8 rounded-xl
                                shadow-lg hover:shadow-xl
                                transform hover:-translate-y-1
                                transition duration-300">
                                Calculate Marks
                            </button>
                        </td>
                    </tr>
                </tfoot>

            </table>
        </div>


        <!-- Result Section -->
        <div class="mt-8">

            <h2 class="text-2xl font-bold text-white text-center mb-5">
                Result
            </h2>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">

                <!-- Total Marks -->
                <div class="bg-white/90 rounded-2xl p-5 text-center shadow-lg
                            hover:scale-105 transition duration-300">
                    <p class="text-gray-500 font-semibold">
                        Total Marks
                    </p>

                    <h3 id="totalMarks"
                        class="text-3xl font-extrabold text-indigo-600 mt-2">
                        -
                    </h3>
                </div>


                <!-- Percentage -->
                <div class="bg-white/90 rounded-2xl p-5 text-center shadow-lg
                            hover:scale-105 transition duration-300">
                    <p class="text-gray-500 font-semibold">
                        Percentage
                    </p>

                    <h3 id="percent"
                        class="text-3xl font-extrabold text-purple-600 mt-2">
                        -
                    </h3>
                </div>


                <!-- Grade -->
                <div class="bg-white/90 rounded-2xl p-5 text-center shadow-lg
                            hover:scale-105 transition duration-300">
                    <p class="text-gray-500 font-semibold">
                        Grade
                    </p>

                    <h3 id="grade"
                        class="text-3xl font-extrabold text-pink-600 mt-2">
                        -
                    </h3>
                </div>

            </div>
        </div>

        <!-- Footer -->
        <p class="text-center text-white/70 text-sm mt-8">
            Enter marks for all subjects and click Calculate Marks
        </p>

    </div>


    <!-- JavaScript -->
    <script>

        function calc() {

            let sub1 = Number(document.getElementById("s1").value);
            let sub2 = Number(document.getElementById("s2").value);
            let sub3 = Number(document.getElementById("s3").value);
            let sub4 = Number(document.getElementById("s4").value);
            let sub5 = Number(document.getElementById("s5").value);

            let total = sub1 + sub2 + sub3 + sub4 + sub5;

            let per = (total / 500) * 100;

            let Grade;

            if (per >= 75) {
                Grade = "A";
            }
            else if (per >= 65) {
                Grade = "B";
            }
            else if (per >= 55) {
                Grade = "C";
            }
            else if (per >= 40) {
                Grade = "D";
            }
            else {
                Grade = "F";
            }

            document.getElementById("totalMarks").innerHTML = total;

            document.getElementById("percent").innerHTML =
                per.toFixed(2) + "%";

            document.getElementById("grade").innerHTML = Grade;
        }

    </script>

</body>
</html>
